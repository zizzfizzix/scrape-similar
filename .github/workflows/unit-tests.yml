name: Unit Tests

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

jobs:
  unit-tests:
    # Skip release PRs created by release-please and skip draft PRs
    if: ${{ !startsWith(github.head_ref, 'release-please--') && github.event.pull_request.draft == false }}
    environment: test
    env:
      NODE_ENV: test
      VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
      VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Format check
        run: pnpm fmt-check

      # Enforces the `coverage.thresholds` block in `vitest.config.ts`: the run
      # exits non-zero if coverage drops below it, so a PR cannot lower it. It
      # then runs `scripts/check-coverage-fidelity.mjs`, which catches what a
      # ratio gate cannot — code dropping out of instrumentation entirely.
      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Summarise coverage
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Build and create extension package
        run: pnpm zip
