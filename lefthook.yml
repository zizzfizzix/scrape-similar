# Git hooks managed by lefthook: https://lefthook.dev/configuration/
# Hooks are installed on `pnpm install` by the `prepare` script
# (`scripts/install-git-hooks.mjs`).
# Set LEFTHOOK=0 to skip all hooks for a single command.

# Formatting, the lint rules and the types are properties of the diff itself, so
# they are checked per commit. Nothing else type-checks locally: Vite and Vitest
# strip types without checking them.
#
# Every command only reads, so they run concurrently: ~35s sequential against
# ~28s in parallel, since Prettier's ~10s, tsc's ~1s and shellcheck's (run only
# when a shell script is staged) hide inside ESLint's. That holds only while
# every command here is read-only — a `pnpm fmt` that writes would race the
# linter reading the same files, and would have to go back to serial.
#
# `pnpm lint` and `pnpm compile` each start with `wxt prepare`, which rewrites the
# auto-import declarations in .wxt/ that ESLint and tsc read. Running it once
# beforehand is what keeps the parallel group read-only: WXT writes a file only
# when its content differs, so the two runs inside the group find nothing to do.
pre-commit:
  # Stop before the group when `wxt prepare` fails, rather than have lint and
  # compile repeat the same failure under their own fail_text.
  piped: true
  jobs:
    - name: wxt-types
      run: pnpm exec wxt prepare && bash scripts/sync-worktree.sh --stamp-types
      fail_text: "Commit blocked: 'wxt prepare' failed; fix wxt.config.ts or the auto-imported sources it reports."
    - group:
        parallel: true
        jobs:
          - name: fmt-check
            run: pnpm fmt-check
            fail_text: "Commit blocked: please run 'pnpm fmt' before staging your changes."
          - name: lint
            run: pnpm lint
            fail_text: "Commit blocked: run 'pnpm lint:fix', then fix what is left by hand."
          - name: compile
            run: pnpm compile
            fail_text: "Commit blocked: fix the type errors 'pnpm compile' reports."
          - name: shellcheck
            glob: ['*.sh', '**/*.sh']
            run: bash scripts/lint-shell.sh {staged_files}
            fail_text: 'Commit blocked: fix what shellcheck reports in the staged shell scripts.'

# The test suite takes ~40s and coverage is a property of the branch as a whole,
# not of each work-in-progress commit, so it gates the push instead.
pre-push:
  commands:
    unit-tests:
      # Same command CI runs, so a coverage regression surfaces here rather
      # than on the PR.
      run: pnpm test:coverage
      fail_text: 'Push blocked: unit tests failed or coverage dropped below the threshold.'

# These hooks re-sync the working tree after the git operations that move
# package.json or pnpm-lock.yaml under it: checkout (including creating a
# worktree), merge (`git pull`), rewrite (`git pull --rebase`, `git rebase`) and
# commit (a merge concluded after a conflict, `cherry-pick`, `revert`). The same
# script regenerates the .wxt types when the tracked files under src/, public/ or
# wxt.config.ts changed. It is a no-op when neither its dependency nor its type
# inputs changed since its last run, so running it often costs little: ~0.8s of
# `wxt prepare` after an operation that changes tracked files under src/,
# public/ or wxt.config.ts, nothing otherwise. A commit made with `git commit` is
# usually covered by pre-commit's run, which records the stamp; cherry-pick and
# revert skip pre-commit, so their post-commit regenerates.
#
# `git reset --hard` and `git stash pop` run no hook, so after those the next of
# these operations catches up.
#
# A rebase needs both hooks: it fires post-checkout once for the commit it starts
# from, which is all a fast-forward (`git rebase <upstream>` with no local
# commits) ever fires, and post-rewrite once after replaying the commits on top.
post-checkout:
  # Stream the install progress instead of buffering it until the hook finishes.
  follow: true
  commands:
    worktree-sync:
      run: bash scripts/sync-worktree.sh

post-merge:
  follow: true
  commands:
    worktree-sync:
      run: bash scripts/sync-worktree.sh

post-rewrite:
  follow: true
  commands:
    worktree-sync:
      run: bash scripts/sync-worktree.sh

# A rebase also commits as it replays; post-rewrite syncs once at its end.
post-commit:
  follow: true
  skip: [rebase]
  commands:
    worktree-sync:
      run: bash scripts/sync-worktree.sh
