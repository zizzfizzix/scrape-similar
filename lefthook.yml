# Git hooks managed by lefthook: https://lefthook.dev/configuration/
# Hooks are installed on `pnpm install` by the `prepare` script
# (`scripts/install-git-hooks.mjs`).
# Set LEFTHOOK=0 to skip all hooks for a single command.

# Formatting and the lint rules are properties of the diff itself, so they are
# checked per commit.
#
# Both commands only read, so they run concurrently: ~34s sequential against
# ~28s in parallel, since Prettier's ~10s now hides inside ESLint's. That holds
# only while every command here is read-only — a `pnpm fmt` that writes would
# race the linter reading the same files, and would have to go back to serial.
pre-commit:
  parallel: true
  commands:
    fmt-check:
      run: pnpm fmt-check
      fail_text: "Commit blocked: please run 'pnpm fmt' before staging your changes."
    lint:
      run: pnpm lint
      fail_text: "Commit blocked: run 'pnpm lint:fix', then fix what is left by hand."

# The test suite takes ~40s and coverage is a property of the branch as a whole,
# not of each work-in-progress commit, so it gates the push instead.
pre-push:
  commands:
    unit-tests:
      # Same command CI runs, so a coverage regression surfaces here rather
      # than on the PR.
      run: pnpm test:coverage
      fail_text: 'Push blocked: unit tests failed or coverage dropped below the threshold.'

post-checkout:
  # Stream the setup progress instead of buffering it until the hook finishes.
  follow: true
  scripts:
    'worktree-setup.sh':
      runner: bash
