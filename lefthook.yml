# Git hooks managed by lefthook: https://lefthook.dev/configuration/
# Hooks are installed on `pnpm install` by the `prepare` script
# (`scripts/install-git-hooks.mjs`).
# Set LEFTHOOK=0 to skip all hooks for a single command.

pre-commit:
  # Both checks are read-only and independent, so run them concurrently.
  parallel: true
  commands:
    fmt-check:
      run: pnpm fmt-check
      fail_text: "Commit blocked: please run 'pnpm fmt' before staging your changes."
    unit-tests:
      # Same command CI runs, so a coverage regression surfaces here rather
      # than on the PR.
      run: pnpm test:coverage
      fail_text: 'Commit blocked: unit tests failed or coverage dropped below the threshold.'

post-checkout:
  # Stream the setup progress instead of buffering it until the hook finishes.
  follow: true
  scripts:
    'worktree-setup.sh':
      runner: bash
