# Git hooks managed by lefthook: https://lefthook.dev/configuration/
# Hooks are installed by `pnpm install` (see the `prepare` script, which
# tolerates a failure so that installs from a source archive without a .git
# directory - e.g. the sources bundle submitted to AMO - still succeed).
# Set LEFTHOOK=0 to skip all hooks for a single command.

pre-commit:
  # Stop at the first failing command so the error stays at the bottom of the log.
  piped: true
  commands:
    fmt-check:
      priority: 1
      run: pnpm fmt-check
      fail_text: "Commit blocked: please run 'pnpm fmt' before staging your changes."
    unit-tests:
      priority: 2
      run: pnpm test
      fail_text: 'Commit blocked: unit tests failed.'

post-checkout:
  # Stream the setup progress instead of buffering it until the hook finishes.
  follow: true
  scripts:
    'worktree-setup.sh':
      runner: bash
